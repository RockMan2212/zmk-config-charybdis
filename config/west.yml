manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: baduino
      url-base: https://github.com/baduino

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    
    # Charybdis 트랙볼 센서(PMW3610)용 최신 드라이버
    - name: zmk-pmw3610-driver
      remote: baduino
      revision: main

  self:
    path: config